<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--u:1px;--blue:#0070d1;--ease:cubic-bezier(.22,.8,.24,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:"SST","Inter","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
button,input{font:inherit;color:inherit;border:0;outline:0;background:none}
[data-f]{cursor:pointer;outline:0}
.hide{display:none!important}

/* ---------- backdrop ---------- */
#bg{position:fixed;inset:0;background:#07122b;overflow:hidden}
#bg .base{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 78% 8%,#1d4fb4 0%,rgba(29,79,180,0) 55%),
  radial-gradient(100% 90% at 8% 100%,#3a1a7a 0%,rgba(58,26,122,0) 55%),
  linear-gradient(160deg,#0a1f4d 0%,#071535 45%,#050a1f 100%);transition:opacity .8s}
#bg .blob{position:absolute;width:calc(900*var(--u));height:calc(900*var(--u));border-radius:50%;filter:blur(90px);opacity:.35;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
#bg .b1{background:#2a6cff;left:calc(-200*var(--u));top:calc(-300*var(--u))}
#bg .b2{background:#7b3cff;right:calc(-250*var(--u));bottom:calc(-350*var(--u));animation-delay:-9s;animation-duration:32s}
@keyframes drift{to{transform:translate(calc(220*var(--u)),calc(120*var(--u))) scale(1.25)}}
#bg .art{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity .7s;filter:blur(26px) brightness(.62) saturate(1.25)}
#bg .art.on{opacity:1}
#bg .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(3,8,22,.78) 0%,rgba(3,8,22,.35) 48%,rgba(3,8,22,.1) 100%),
  linear-gradient(0deg,rgba(2,5,14,.85) 0%,rgba(2,5,14,0) 42%),
  linear-gradient(180deg,rgba(2,5,14,.6) 0%,rgba(2,5,14,0) 22%)}
body.static #bg .blob{animation:none}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:calc(150*var(--u));z-index:20;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(52*var(--u)) calc(88*var(--u)) 0 calc(112*var(--u));transition:opacity .35s,transform .45s var(--ease)}
#top .tabs{display:flex;gap:calc(46*var(--u));align-items:center}
.tab{position:relative;font-size:calc(27*var(--u));font-weight:400;color:rgba(255,255,255,.55);padding:calc(8*var(--u)) calc(6*var(--u)) calc(14*var(--u));letter-spacing:.01em;transition:color .25s}
.tab.active{color:#fff;font-weight:500}
.tab.active::after{content:"";position:absolute;left:calc(6*var(--u));right:calc(6*var(--u));bottom:calc(2*var(--u));height:calc(4*var(--u));border-radius:calc(3*var(--u));background:#fff}
.tab.focus{color:#fff;text-shadow:0 0 calc(18*var(--u)) rgba(255,255,255,.6)}
.tab.focus::before{content:"";position:absolute;inset:calc(-4*var(--u)) calc(-14*var(--u)) 0;border-radius:calc(30*var(--u));border:calc(3*var(--u)) solid #fff;box-shadow:0 0 0 calc(3*var(--u)) rgba(255,255,255,.18),0 0 calc(30*var(--u)) rgba(255,255,255,.35)}
#top .right{display:flex;align-items:center;gap:calc(18*var(--u))}
.ibtn{width:calc(58*var(--u));height:calc(58*var(--u));border-radius:50%;display:grid;place-items:center;font-size:calc(25*var(--u));color:#fff;background:rgba(255,255,255,.0);transition:background .2s,transform .2s}
.ibtn:hover{background:rgba(255,255,255,.14)}
.ibtn.focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 calc(3*var(--u)) #fff,0 0 calc(26*var(--u)) rgba(255,255,255,.4);transform:scale(1.08)}
.avatar{width:calc(50*var(--u));height:calc(50*var(--u));border-radius:50%;background:linear-gradient(135deg,#00b4ff,#6a4cff);display:grid;place-items:center;font-weight:600;font-size:calc(22*var(--u))}
#clock{font-size:calc(25*var(--u));font-weight:400;margin-left:calc(10*var(--u));min-width:calc(120*var(--u));text-align:right;letter-spacing:.02em}
.batt{display:flex;align-items:center;gap:calc(8*var(--u));font-size:calc(20*var(--u));color:rgba(255,255,255,.85);margin-left:calc(6*var(--u))}
.batt i{font-size:calc(22*var(--u))}

/* ---------- home ---------- */
.view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .35s}
.view.on{opacity:1;pointer-events:auto}
#v-home .pane{position:absolute;inset:0;opacity:0;transform:translateY(calc(24*var(--u)));transition:opacity .4s,transform .5s var(--ease);pointer-events:none}
#v-home .pane.on{opacity:1;transform:none;pointer-events:auto}
.rowwrap{position:absolute;left:0;right:0;top:calc(268*var(--u));height:calc(360*var(--u));overflow:visible}
.track{position:absolute;left:0;top:0;display:flex;align-items:flex-start;gap:calc(24*var(--u));transition:transform .5s var(--ease);will-change:transform}
.card{position:relative;flex:none;border-radius:calc(14*var(--u));overflow:hidden;background:#101a33;transition:width .45s var(--ease),height .45s var(--ease),box-shadow .35s,opacity .35s;opacity:.92}
.gcard{width:calc(152*var(--u));height:calc(152*var(--u))}
.gcard.sel{width:calc(232*var(--u));height:calc(232*var(--u))}
.acard{width:calc(262*var(--u));height:calc(147*var(--u))}
.acard.sel{width:calc(392*var(--u));height:calc(220*var(--u))}
.card.sel{opacity:1;box-shadow:0 0 0 calc(4*var(--u)) #fff,0 0 0 calc(8*var(--u)) rgba(255,255,255,.22),0 calc(24*var(--u)) calc(60*var(--u)) rgba(0,0,0,.55),0 0 calc(60*var(--u)) rgba(120,170,255,.35)}
body.barfocus .card.sel{box-shadow:0 calc(18*var(--u)) calc(40*var(--u)) rgba(0,0,0,.45)}
.art{position:relative;width:100%;aspect-ratio:1;border-radius:inherit;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,220) 60% 36%),hsl(calc(var(--h,220) + 40) 65% 18%))}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:#0d1530}
.art .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;padding:9%;text-align:center;font-weight:600;font-size:calc(14*var(--u));line-height:1.15;color:rgba(255,255,255,.95);text-shadow:0 calc(2*var(--u)) calc(8*var(--u)) rgba(0,0,0,.4);word-break:break-word;background:radial-gradient(90% 90% at 25% 15%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)}
.art .ph svg{width:46%;height:auto;flex:none;filter:drop-shadow(0 calc(4*var(--u)) calc(10*var(--u)) rgba(0,0,0,.35));opacity:.97}
.art .ph span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.card .art{height:100%;aspect-ratio:auto}
.card.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%);pointer-events:none;z-index:4}
.libcard{background:linear-gradient(145deg,#2a3f78,#162247);display:grid;place-items:center;text-align:center;color:#fff}
.libcard i{font-size:calc(46*var(--u));opacity:.95}
.libcard.sel i{font-size:calc(70*var(--u))}
.libcard small{display:block;font-size:calc(15*var(--u));margin-top:calc(10*var(--u));opacity:.8}
.appart{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;position:relative}
.appart .bgicon{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(28px) saturate(1.4);opacity:.38;transform:scale(1.2)}
.appart .aicon{position:relative;z-index:2;height:64%;width:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 calc(10*var(--u)) calc(22*var(--u)) rgba(0,0,0,.5));transition:height .45s var(--ease)}
.acard.sel .appart .aicon{height:68%}
.appart .glyph{position:absolute;font-size:calc(58*var(--u));filter:drop-shadow(0 calc(4*var(--u)) calc(14*var(--u)) rgba(0,0,0,.35));transition:font-size .4s var(--ease)}
.acard.sel .appart .glyph{font-size:calc(86*var(--u))}
#launch .appart{width:100%;height:100%}#launch .appart .aicon{height:70%}
.appart .wm{font-weight:700;letter-spacing:.04em;font-size:calc(30*var(--u));text-align:center;line-height:1}
.acard.sel .appart .wm{font-size:calc(46*var(--u))}

.info{position:absolute;left:calc(112*var(--u));top:calc(660*var(--u));width:calc(1100*var(--u));transition:opacity .3s,transform .4s var(--ease)}
.info.swap{opacity:0;transform:translateY(calc(10*var(--u)))}
.info h1{font-size:calc(46*var(--u));font-weight:300;letter-spacing:.005em;line-height:1.15;text-shadow:0 calc(3*var(--u)) calc(20*var(--u)) rgba(0,0,0,.5);max-width:calc(1000*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .meta{margin-top:calc(10*var(--u));font-size:calc(20*var(--u));color:rgba(255,255,255,.7);display:flex;gap:calc(16*var(--u));align-items:center}
.chip{padding:calc(4*var(--u)) calc(12*var(--u));border-radius:calc(6*var(--u));background:rgba(255,255,255,.14);font-size:calc(17*var(--u));letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:calc(14*var(--u));margin-top:calc(30*var(--u));height:calc(68*var(--u));padding:0 calc(46*var(--u));border-radius:calc(40*var(--u));background:#fff;color:#111;font-size:calc(24*var(--u));font-weight:500;box-shadow:0 calc(8*var(--u)) calc(30*var(--u)) rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.pill:hover{transform:scale(1.04)}
.pill.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.pill.focus{box-shadow:0 0 0 calc(4*var(--u)) #fff,0 0 0 calc(8*var(--u)) rgba(255,255,255,.25),0 0 calc(40*var(--u)) rgba(255,255,255,.4);transform:scale(1.05)}
.pill.ghost.focus{background:rgba(255,255,255,.28)}
.hints{position:fixed;left:0;right:0;bottom:calc(36*var(--u));display:flex;justify-content:center;gap:calc(44*var(--u));font-size:calc(19*var(--u));color:rgba(255,255,255,.62);z-index:15;pointer-events:none;transition:opacity .3s}
body.nohints .hints{opacity:0}
.hints span{display:flex;align-items:center;gap:calc(10*var(--u))}
.btnx{width:calc(30*var(--u));height:calc(30*var(--u));border-radius:50%;border:calc(2*var(--u)) solid rgba(255,255,255,.6);display:inline-grid;place-items:center;font-size:calc(15*var(--u));line-height:1;font-weight:600}
.btnx.x{color:#8ab4ff}.btnx.o{color:#ff8a8a}.btnx.t{color:#7be3b0}.btnx.s{color:#f5a8e0}

/* ---------- shared pages (library, search, netflix, browser) ---------- */
.page{background:rgba(4,9,24,.82);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2)}
.pagehead{position:absolute;left:calc(112*var(--u));right:calc(112*var(--u));top:calc(52*var(--u));display:flex;align-items:center;gap:calc(22*var(--u))}
.pagehead h2{font-size:calc(38*var(--u));font-weight:300;flex:1}
.pagehead h2 small{font-size:calc(22*var(--u));color:rgba(255,255,255,.55);margin-left:calc(14*var(--u))}
.scroll{position:absolute;left:0;right:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
#libscroll{top:calc(200*var(--u));bottom:0;padding:calc(26*var(--u)) calc(112*var(--u)) calc(110*var(--u))}
.filters{position:absolute;left:calc(112*var(--u));right:calc(112*var(--u));top:calc(138*var(--u));display:flex;gap:calc(6*var(--u));flex-wrap:wrap;z-index:2}
.fchip{min-width:calc(40*var(--u));height:calc(40*var(--u));padding:0 calc(12*var(--u));border-radius:calc(20*var(--u));display:grid;place-items:center;font-size:calc(19*var(--u));color:rgba(255,255,255,.7);transition:background .2s}
.fchip.active{background:#fff;color:#111;font-weight:600}
.fchip.focus{box-shadow:0 0 0 calc(3*var(--u)) #fff,0 0 calc(20*var(--u)) rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.25)}
.fchip.active.focus{color:#111;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(168*var(--u)),1fr));gap:calc(36*var(--u)) calc(26*var(--u))}
.gi{position:relative;transition:transform .25s var(--ease)}
.gi .art{border-radius:calc(12*var(--u));transition:box-shadow .25s}
.gi .cap{margin-top:calc(12*var(--u));font-size:calc(17*var(--u));line-height:1.25;color:rgba(255,255,255,.85);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gi.focus{transform:scale(1.07);z-index:3}
.gi.focus .art{box-shadow:0 0 0 calc(4*var(--u)) #fff,0 0 0 calc(8*var(--u)) rgba(255,255,255,.22),0 calc(18*var(--u)) calc(44*var(--u)) rgba(0,0,0,.6)}
.gi.focus .cap{color:#fff}
.gi.wide .art{aspect-ratio:16/9}
.empty{padding:calc(120*var(--u)) 0;text-align:center;font-size:calc(26*var(--u));color:rgba(255,255,255,.55)}

/* ---------- search ---------- */
#search{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(3,7,20,.9);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
#search.on{opacity:1;pointer-events:auto}
#search .left{position:absolute;left:calc(112*var(--u));top:calc(100*var(--u));width:calc(760*var(--u))}
#search h2{font-size:calc(38*var(--u));font-weight:300;margin-bottom:calc(30*var(--u))}
.sfield{display:flex;align-items:center;gap:calc(18*var(--u));height:calc(86*var(--u));padding:0 calc(26*var(--u));border-radius:calc(16*var(--u));background:rgba(255,255,255,.1);border:calc(3*var(--u)) solid transparent;transition:border-color .2s,background .2s}
.sfield i{font-size:calc(26*var(--u));color:rgba(255,255,255,.7)}
.sfield input{flex:1;font-size:calc(30*var(--u));font-weight:300;min-width:0;user-select:text}
.sfield input::placeholder{color:rgba(255,255,255,.4)}
.sfield.focus{border-color:#fff;background:rgba(255,255,255,.16);box-shadow:0 0 calc(40*var(--u)) rgba(255,255,255,.25)}
.osk{margin-top:calc(26*var(--u));display:grid;gap:calc(10*var(--u))}
.osk .r{display:flex;gap:calc(10*var(--u))}
.key{flex:1;height:calc(68*var(--u));border-radius:calc(12*var(--u));background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:calc(25*var(--u));transition:background .15s,transform .15s}
.key:hover{background:rgba(255,255,255,.2)}
.key.sp{flex:5}.key.w{flex:2}
.key.focus{background:#fff;color:#111;transform:scale(1.07);box-shadow:0 0 calc(26*var(--u)) rgba(255,255,255,.5)}
#sres{position:absolute;left:calc(940*var(--u));right:0;top:0;bottom:0;padding:calc(100*var(--u)) calc(112*var(--u)) calc(80*var(--u)) 0;overflow-y:auto;scrollbar-width:none}
#sres::-webkit-scrollbar{display:none}
.sec{margin-bottom:calc(44*var(--u))}
.sec h3{font-size:calc(23*var(--u));font-weight:500;color:rgba(255,255,255,.75);margin-bottom:calc(20*var(--u));display:flex;align-items:baseline;gap:calc(12*var(--u))}
.sec h3 small{font-size:calc(18*var(--u));color:rgba(255,255,255,.45);font-weight:400}
.srow{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(142*var(--u)),1fr));gap:calc(26*var(--u)) calc(20*var(--u))}
.srow.wide{grid-template-columns:repeat(auto-fill,minmax(calc(236*var(--u)),1fr))}
.li{display:flex;align-items:center;gap:calc(20*var(--u));height:calc(76*var(--u));padding:0 calc(26*var(--u));border-radius:calc(14*var(--u));background:rgba(255,255,255,.08);font-size:calc(22*var(--u));margin-bottom:calc(12*var(--u));transition:transform .2s,background .2s}
.li i{font-size:calc(24*var(--u));width:calc(34*var(--u));text-align:center;color:#8ab4ff}
.li b{font-weight:500;color:#fff}
.li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.focus{background:#fff;color:#111;transform:scale(1.02);box-shadow:0 0 calc(30*var(--u)) rgba(255,255,255,.35)}
.li.focus i{color:#0070d1}.li.focus b{color:#111}
.sbusy{font-size:calc(19*var(--u));color:rgba(255,255,255,.5);padding:calc(6*var(--u)) 0 calc(18*var(--u))}

/* ---------- player / browser ---------- */
#v-player{background:#000;z-index:30}
#v-player iframe,#v-browser iframe{position:absolute;left:0;right:0;bottom:0;top:0;width:100%;height:100%;border:0;background:#fff}
#v-player iframe{background:#000}
#launch{position:absolute;inset:0;z-index:5;background:#000;display:grid;place-items:center;transition:opacity .6s;overflow:hidden}
#launch .lbg{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(40px) brightness(.45) saturate(1.3);transform:scale(1.1)}
#launch .lbox{position:relative;text-align:center}
#launch .lart{width:calc(280*var(--u));height:calc(280*var(--u));border-radius:calc(18*var(--u));margin:0 auto calc(34*var(--u));box-shadow:0 calc(30*var(--u)) calc(80*var(--u)) rgba(0,0,0,.6);overflow:hidden}
#launch h2{font-size:calc(36*var(--u));font-weight:300}
#launch .bar{width:calc(360*var(--u));height:calc(5*var(--u));background:rgba(255,255,255,.2);border-radius:calc(3*var(--u));margin:calc(30*var(--u)) auto 0;overflow:hidden}
#launch .bar i{display:block;height:100%;width:30%;background:#fff;border-radius:calc(3*var(--u));animation:ld 1.3s ease-in-out infinite}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
#launch.gone{opacity:0;pointer-events:none}
.hot{position:absolute;left:0;right:0;top:0;height:calc(16*var(--u));z-index:8}
.hotbar{position:absolute;left:50%;top:0;transform:translate(-50%,-110%);z-index:9;display:flex;gap:calc(10*var(--u));padding:calc(12*var(--u)) calc(14*var(--u));border-radius:0 0 calc(22*var(--u)) calc(22*var(--u));background:rgba(10,14,28,.92);backdrop-filter:blur(20px);transition:transform .35s var(--ease);box-shadow:0 calc(10*var(--u)) calc(40*var(--u)) rgba(0,0,0,.5)}
.hot:hover+.hotbar,.hotbar:hover,.hotbar.show{transform:translate(-50%,0)}
.hotbar button{height:calc(48*var(--u));padding:0 calc(22*var(--u));border-radius:calc(24*var(--u));background:rgba(255,255,255,.12);font-size:calc(19*var(--u));display:flex;align-items:center;gap:calc(10*var(--u));transition:background .2s}
.hotbar button:hover{background:rgba(255,255,255,.28)}
.hotbar .ps{background:#fff;color:#0a1a4a;font-weight:700;letter-spacing:.02em}
#v-browser{background:#0b1022;z-index:25}
.btool{position:absolute;left:0;right:0;top:0;height:calc(92*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(36*var(--u));background:rgba(12,18,40,.96);border-bottom:calc(1*var(--u)) solid rgba(255,255,255,.08);z-index:3}
.btool .ibtn{width:calc(56*var(--u));height:calc(56*var(--u));font-size:calc(30*var(--u));flex:none}
.btool .sfield{flex:1;height:calc(60*var(--u));border-radius:calc(30*var(--u));padding:0 calc(26*var(--u))}
.btool .sfield input{font-size:calc(22*var(--u))}
.bframe{position:absolute;left:0;right:0;top:calc(92*var(--u));bottom:0}
#v-browser iframe{top:0}
.bstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(50*var(--u));background:radial-gradient(90% 70% at 50% 0%,#17306e,#0a1022 70%)}
.bstart h1{font-size:calc(54*var(--u));font-weight:300;letter-spacing:.02em}
.bstart .links{display:grid;grid-template-columns:repeat(4,calc(170*var(--u)));gap:calc(26*var(--u))}
.bl{height:calc(130*var(--u));border-radius:calc(16*var(--u));background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(12*var(--u));font-size:calc(19*var(--u));transition:transform .2s,background .2s}
.bl i{font-size:calc(34*var(--u))}
.bl.focus{background:#fff;color:#111;transform:scale(1.07);box-shadow:0 0 calc(30*var(--u)) rgba(255,255,255,.4)}

/* ---------- netflix ---------- */
#v-netflix{background:#0a0a0a;z-index:25}

function scoreStr(q,t){if(t===q)return 1000;if(t.startsWith(q))return 800-t.length*.1;
  if(t.split(/[^a-z0-9]+/).some(w=>w.startsWith(q)))return 600-t.length*.1;
  const i=t.indexOf(q);if(i>=0)return 420-i-t.length*.05;
  const toks=q.split(/\s+/);if(toks.length>1&&toks.every(x=>t.includes(x)))return 300-t.length*.05;
  if(q.length>=3){let p=0,gap=0,last=-1;for(let k=0;k<t.length&&p<q.length;k++){if(t[k]===q[p]){if(last>=0)gap+=k-last-1;last=k;p++}}if(p===q.length&&gap<=Math.floor(q.length/4))return 120-gap}
  return 0}
function searchGames(q,max=60){q=q.toLowerCase().trim();if(!q)return[];const out=[];for(const g of G){const s=scoreStr(q,g.lc);if(s>0)out.push([s+(g.img?5:0)+(g.feat?40:0),g])}
  out.sort((a,b)=>b[0]-a[0]||a[1].title.localeCompare(b[1].title));return out.slice(0,max).map(x=>x[1])}
function searchApps(q){q=q.toLowerCase().trim();if(!q)return APPS.slice();return APPS.map(a=>{const s=Math.max(scoreStr(q,a.name.toLowerCase()),a.kw.split(" ").some(w=>w.startsWith(q))?500:0,a.kw.includes(q)?200:0);return[s,a]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}

function runSearch(){const q=$("#s-q").value.trim();$("#s-clear").style.display=q?"":"none";const res=$("#sres");const seq=++sSeq;res.innerHTML="";

  if(games.length){const s=sec(q?"Games":"Suggested games",q?games.length+(games.length>=200?"+":""):"");const row=el("div","srow");games.slice(0,q?24:12).forEach(g=>row.append(gameItem(g)));s.append(row);

$("#nf-sf").addEventListener("mousedown",()=>focusEl($("#nf-sf"),$("#v-netflix")));
// keep focus ring in sync with real input focus
document.addEventListener("focusin",e=>{if(e.target.tagName==="INPUT"){const w=e.target.closest("[data-f]");if(w){const sc=w.closest("#search,#v-browser,#v-netflix");if(sc)focusEl(w,sc)}}});

/* ---------- keyboard ---------- */
addEventListener("keydown",e=>{
  if(S.off){e.preventDefault();powerOn();return}
  const k=e.key,inInput=e.target&&e.target.tagName==="INPUT";
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==="Escape"){e.preventDefault();if(S.view==="home"&&!S.search&&!S.settings&&!S.cc&&S.zone==="row")openCC();else back();return}
  if(k==="`"||k==="F1"){e.preventDefault();S.cc?closeCC():openCC();return}
  if(inInput){
    if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();navigate(k==="ArrowDown"?"down":"up")}
    else if(k==="Tab"){e.preventDefault();navigate(e.shiftKey?"up":"down")}
    return}
  if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"){if(S.view==="player"&&!S.cc&&!S.settings&&!S.search)return;e.preventDefault();navigate(k.slice(5).toLowerCase());return}
  if(S.view==="player"&&!S.cc&&!S.settings&&!S.search)return;
  if(k==="Enter"||k===" "){e.preventDefault();select();return}
  if(k==="Backspace"){e.preventDefault();if(S.search){const i=$("#s-q");i.value=i.value.slice(0,-1);runSearch();snd.move()}else back();return}
  if(S.view==="home"&&!S.cc&&!S.settings&&!S.search){
    if(k==="q"||k==="Q"||k==="PageUp"){setTab("games",true);return}
    if(k==="e"||k==="E"||k==="PageDown"){setTab("media",true);return}}
  if(k==="Tab"){e.preventDefault();return}
  if(k==="/"){e.preventDefault();if(!S.search)openSearch();return}
  if(S.search&&!inInput&&k.length===1&&/\S/.test(k)){const i=$("#s-q");i.focus();return} // char lands in the input
  if(S.view==="home"&&!S.search&&!S.cc&&!S.settings&&k.length===1&&/[a-z0-9]/i.test(k)){e.preventDefault();openSearch(k)}
});

/* ---------- gamepad ---------- */
const GP={prev:{},rep:{}};
function gpLoop(){const pads=navigator.getGamepads?navigator.getGamepads():[];const p=[...pads].find(x=>x&&x.connected);
  if(p&&!S.off){const now=performance.now();const down=i=>p.buttons[i]&&p.buttons[i].pressed;
    const ax=p.axes[0]||0,ay=p.axes[1]||0;
    const st={left:down(14)||ax<-.55,right:down(15)||ax>.55,up:down(12)||ay<-.55,down:down(13)||ay>.55};
    const inGame=S.view==="player"&&!S.cc&&!S.settings&&!S.search;
    if(!inGame)for(const d in st){if(st[d]){const r=GP.rep[d];if(r==null){GP.rep[d]=now+380;navigate(d)}else if(now>r){GP.rep[d]=now+110;navigate(d)}}else GP.rep[d]=null}
    const edge=(i,fn)=>{const v=!!down(i);if(v&&!GP.prev[i])fn();GP.prev[i]=v};
    edge(16,()=>S.cc?closeCC():openCC());edge(8,()=>{if(inGame)openCC()});
    if(!inGame){edge(0,()=>{if(S.search&&document.activeElement&&document.activeElement.tagName==="INPUT")return;select()});edge(1,back);edge(3,()=>{if(S.view==="home"||S.view==="library")openSearch()});edge(2,()=>{if(S.view==="home")openSettings()});
      edge(4,()=>S.view==="home"&&setTab("games",true));edge(5,()=>S.view==="home"&&setTab("media",true));edge(9,()=>S.view==="home"&&openSettings())}}
  requestAnimationFrame(gpLoop)}
requestAnimationFrame(gpLoop);
addEventListener("gamepadconnected",e=>{toast("Controller connected")});

/* ======================================================================
   BOOT / CLOCK
   ====================================================================== */
function tick(){$("#clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
setInterval(tick,15000);tick();
function powerOn(){if(!S.off)return;S.off=false;ac();const b=$("#boot");b.classList.add("run");chime();
  setTimeout(()=>{b.classList.add("gone");document.body.classList.remove("booting");enter()},3300)}
function restart(){S.off=true;S.player=null;$("#pframe").innerHTML="";showView("home");const b=$("#boot");b.className="";document.body.classList.add("booting");setTimeout(()=>{S.off=true;powerOn()},500)}
function enter(){showView("home");S.zone="row";setZone();renderSel(S.tab,true)}

/* init */
document.body.classList.toggle("static",!set.dyn);document.body.classList.toggle("nohints",!set.hints);$("#avatar").textContent=(set.name||"P")[0].toUpperCase();
buildOSK();buildTrack("games");buildTrack("media");
$$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===S.tab));$("#pane-games").classList.toggle("on",S.tab==="games");$("#pane-media").classList.toggle("on",S.tab==="media");
S.idx.games=Math.min(1,gamesItems().length-1);renderSel("games",true);renderSel("media",true);
$("#boot").addEventListener("click",()=>powerOn());
document.addEventListener("fullscreenchange",()=>fit());
// Auto-boot into the OS (no key press required)
setTimeout(powerOn, 400);
</script>
</body>
</html>
